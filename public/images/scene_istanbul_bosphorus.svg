<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="istSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="bosphorus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shis" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1600" height="440" fill="url(#istSky)"/>
  <rect y="440" width="1600" height="460" fill="url(#bosphorus)"/>
  <!-- Bosphorus Bridge (background, x:50%, y:28% -> 800, 252) -->
  <g stroke="#ef4444" stroke-width="10" fill="none">
    <line x1="420" y1="130" x2="420" y2="440" stroke-width="18"/>
    <line x1="1180" y1="130" x2="1180" y2="440" stroke-width="18"/>
    <path d="M120 300 Q420 150 420 130 Q800 320 1180 130 Q1180 150 1480 300" stroke-width="8"/>
    <line x1="80" y1="320" x2="1520" y2="320" stroke="#e2e8f0" stroke-width="14"/>
  </g>
  <!-- Galata Tower (left, x:16%, y:30% -> 256, 270) -->
  <g filter="url(#shis)">
    <rect x="200" y="210" width="90" height="230" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
    <polygon points="190,210 245,120 300,210" fill="#475569"/>
  </g>
  <!-- Maiden's Tower / Kiz Kulesi (right, x:84%, y:46% -> 1344, 414) -->
  <g filter="url(#shis)">
    <ellipse cx="1344" cy="520" rx="95" ry="24" fill="#cbd5e1"/>
    <rect x="1300" y="390" width="88" height="125" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
    <polygon points="1294,390 1344,335 1394,390" fill="#ef4444"/>
  </g>
  <!-- Seagulls (x:62%, y:18% -> 992, 162) -->
  <path d="M950 165 Q970 140 990 165 Q1010 140 1030 165" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <path d="M720 135 Q736 116 752 135 Q768 116 784 135" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <!-- Istanbul Ferry / Vapur (center, x:46%, y:62% -> 736, 558) -->
  <g filter="url(#shis)" transform="translate(460, 450)">
    <polygon points="30,130 510,130 465,200 75,200" fill="#ffffff" stroke="#1e293b" stroke-width="5"/>
    <rect x="95" y="65" width="350" height="65" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
    <rect x="235" y="15" width="46" height="50" rx="8" fill="#ef4444"/>
    <!-- Simit & Tea on deck (x:34%, y:68%) -->
    <circle cx="155" cy="98" r="18" fill="none" stroke="#f59e0b" stroke-width="10"/>
  </g>
</svg>
