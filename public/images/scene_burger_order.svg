        <line x1="0" y1="690" x2="1600" y2="690" stroke="#0f172a" stroke-opacity="0.06" stroke-width="3"/>
        <line x1="0" y1="775" x2="1600" y2="775" stroke="#0f172a" stroke-opacity="0.06" stroke-width="3"/>
        <line x1="0" y1="855" x2="1600" y2="855" stroke="#0f172a" stroke-opacity="0.06" stroke-width="3"/>
      </g>
  <rect y="620" width="1600" height="280" fill="#fed7aa"/>

