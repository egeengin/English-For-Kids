      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="sh11" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="630" fill="url(#musWall)"/>
  <rect y="630" width="1600" height="270" fill="#334155"/>

  <!-- Stars & Saturn Planet (top-right, x:78%, y:22% -> 1248, 198) -->
  <circle cx="1050" cy="140" r="5" fill="#fef08a"/>
  <circle cx="1150" cy="100" r="4" fill="#ffffff"/>
  <circle cx="1420" cy="150" r="6" fill="#fef08a"/>
