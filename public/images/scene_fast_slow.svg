<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="raceSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <filter id="shfs" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  
    <radialGradient id="sunGlow_scene_fast_slow.svg" cx="50%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette_scene_fast_slow.svg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.16"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="500" fill="url(#raceSky)"/>

      <g data-enriched="true" opacity="0.85">
        <g fill="#ffffff" opacity="0.75">
          <ellipse cx="260" cy="125" rx="75" ry="28"/>
          <ellipse cx="305" cy="112" rx="52" ry="26"/>
          <ellipse cx="1220" cy="145" rx="85" ry="30"/>
          <ellipse cx="1270" cy="132" rx="58" ry="28"/>
        </g>
        <path d="M0 595 Q400 535 800 585 T1600 570 L1600 630 L0 630 Z" fill="#0f172a" opacity="0.06"/>
      </g>
  <rect y="500" width="1600" height="400" fill="#475569"/>
  <line x1="0" y1="700" x2="1600" y2="700" stroke="#fde047" stroke-width="8" stroke-dasharray="40 30"/>
  <!-- High Airplane (x:24%, y:20% -> 384, 180) -->
  <g filter="url(#shfs)" transform="translate(270, 130)">
    <ellipse cx="110" cy="48" rx="95" ry="24" fill="#ffffff"/>
    <polygon points="30,45 10,10 38,10 60,42" fill="#ef4444"/>
    <polygon points="90,52 145,86 165,86 130,52" fill="#38bdf8"/>
  </g>
  <!-- Fast Red Race Car (x:38%, y:60% -> 608, 540) -->
  <g filter="url(#shfs)" transform="translate(430, 470)">
    <rect x="20" y="65" width="320" height="72" rx="26" fill="#ef4444" stroke="#b91c1c" stroke-width="5"/>
    <path d="M95 65 L145 18 L245 18 L285 65 Z" fill="#38bdf8"/>
    <circle cx="95" cy="142" r="34" fill="#1e293b"/>
    <circle cx="95" cy="142" r="14" fill="#cbd5e1"/>
    <circle cx="275" cy="142" r="34" fill="#1e293b"/>
    <circle cx="275" cy="142" r="14" fill="#cbd5e1"/>
  </g>
  <!-- Slow Green Turtle (x:62%, y:80% -> 992, 720) -->
  <g filter="url(#shfs)">
    <ellipse cx="992" cy="740" rx="58" ry="36" fill="#16a34a"/>
    <circle cx="1056" cy="735" r="20" fill="#4ade80"/>
    <rect x="955" y="768" width="18" height="22" rx="6" fill="#4ade80"/>
    <rect x="1015" y="768" width="18" height="22" rx="6" fill="#4ade80"/>
  </g>
  <!-- Finish Flag & Trophy (right, x:86%, y:56% -> 1376, 504) -->
  <g filter="url(#shfs)">
    <line x1="1380" y1="320" x2="1380" y2="560" stroke="#ffffff" stroke-width="10"/>
    <rect x="1385" y="325" width="110" height="70" fill="#1e293b"/>
    <rect x="1385" y="325" width="55" height="35" fill="#ffffff"/>
    <rect x="1440" y="360" width="55" height="35" fill="#ffffff"/>
  </g>

    <rect width="1600" height="900" fill="url(#sunGlow_scene_fast_slow.svg)" pointer-events="none"/>
    <rect width="1600" height="900" fill="url(#vignette_scene_fast_slow.svg)" pointer-events="none"/>
</svg>
