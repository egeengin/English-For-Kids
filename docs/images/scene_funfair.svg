  <!-- Deniz with Balloon (x:44%, y:68% -> 704, 612) -->
  <g filter="url(#sh12)">
    <line x1="650" y1="600" x2="625" y2="455" stroke="#475569" stroke-width="4"/>
    <circle cx="625" cy="422" r="34" fill="#a855f7"/>
    <rect x="680" y="695" width="20" height="72" rx="8" fill="#1d4ed8"/>
    <rect x="712" y="695" width="20" height="72" rx="8" fill="#1d4ed8"/>
    <rect x="670" y="595" width="72" height="106" rx="20" fill="#facc15"/>
    <circle cx="706" cy="552" r="38" fill="#fed7aa"/>
    <path d="M668 544 Q674 504 706 504 Q738 504 744 544 Z" fill="#451a03"/>
    <circle cx="692" cy="552" r="4.5" fill="#1e293b"/>
    <circle cx="720" cy="552" r="4.5" fill="#1e293b"/>
    <path d="M694 568 Q706 578 718 568" fill="none" stroke="#9a3412" stroke-width="4" stroke-linecap="round"/>
