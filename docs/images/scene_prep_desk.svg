  <!-- Chair (right, x:88%, y:56%) -->
  <g filter="url(#sh10)">
    <rect x="1330" y="435" width="110" height="110" rx="18" fill="#22c55e"/>
    <rect x="1320" y="540" width="130" height="24" rx="10" fill="#16a34a"/>
    <line x1="1338" y1="564" x2="1338" y2="645" stroke="#15803d" stroke-width="12"/>
    <line x1="1432" y1="564" x2="1432" y2="645" stroke="#15803d" stroke-width="12"/>
