      <rect x="10" y="54" width="152" height="10" fill="#ef4444"/>
      <rect x="52" y="30" width="8" height="22" rx="2" fill="#ef4444"/>
      <rect x="45" y="37" width="22" height="8" rx="2" fill="#ef4444"/>
      <rect x="65" y="12" width="22" height="10" rx="4" fill="#3b82f6"/>
      <circle cx="42" cy="82" r="14" fill="#334155"/>
      <circle cx="42" cy="82" r="6" fill="#cbd5e1"/>
      <circle cx="130" cy="82" r="14" fill="#334155"/>
