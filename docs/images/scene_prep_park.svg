<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="parkSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <filter id="sh9" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1600" height="540" fill="url(#parkSky)"/>
  <rect y="540" width="1600" height="360" fill="#4ade80"/>

  <!-- Kite ABOVE the park (x:74%, y:18% -> 1184, 162) -->
  <g filter="url(#sh9)">
    <polygon points="1184,95 1234,155 1184,215 1134,155" fill="#f43f5e" stroke="#ffffff" stroke-width="4"/>
    <path d="M1184 215 Q1160 270 1190 320" fill="none" stroke="#fde047" stroke-width="5"/>
  </g>

  <!-- Puppy BEHIND the tree (tree at x:22%, puppy peeking at x:27%, y:54% -> 432, 486) -->
  <g filter="url(#sh9)">
    <!-- Puppy peeking behind trunk -->
    <circle cx="430" cy="488" r="28" fill="#d97706"/>
    <ellipse cx="445" cy="482" rx="10" ry="18" fill="#78350f"/>
    <circle cx="424" cy="484" r="4" fill="#1e293b"/>
    <circle cx="438" cy="484" r="4" fill="#1e293b"/>
    <circle cx="432" cy="496" r="5" fill="#1e293b"/>
    <!-- Big Tree -->
    <rect x="305" y="340" width="90" height="240" rx="16" fill="#92400e"/>
    <circle cx="350" cy="250" r="110" fill="#22c55e"/>
    <circle cx="275" cy="300" r="75" fill="#16a34a"/>
    <circle cx="425" cy="300" r="75" fill="#16a34a"/>
  </g>

  <!-- Park Bench with Bird ON it (x:50%, y:56% -> 800, 504) -->
  <g filter="url(#sh9)">
    <rect x="690" y="470" width="220" height="40" rx="8" fill="#b45309"/>
    <rect x="680" y="518" width="240" height="22" rx="8" fill="#d97706"/>
    <rect x="705" y="540" width="16" height="65" fill="#475569"/>
    <rect x="880" y="540" width="16" height="65" fill="#475569"/>
    <!-- Blue Bird ON bench (x:50%, y:49% -> 800, 441) -->
    <ellipse cx="800" cy="448" rx="22" ry="16" fill="#38bdf8"/>
    <circle cx="818" cy="436" r="12" fill="#38bdf8"/>
    <polygon points="828,434 842,438 828,442" fill="#f59e0b"/>
  </g>

  <!-- Squirrel BETWEEN two bushes (x:68%, y:64% -> 1088, 576) -->
  <g filter="url(#sh9)">
    <circle cx="1010" cy="585" r="52" fill="#15803d"/>
    <circle cx="1166" cy="585" r="52" fill="#15803d"/>
    <!-- Squirrel -->
    <ellipse cx="1088" cy="590" rx="20" ry="26" fill="#ea580c"/>
    <circle cx="1088" cy="558" r="16" fill="#ea580c"/>
    <circle cx="1082" cy="554" r="3" fill="#1e293b"/>
  </g>

  <!-- Slide & Boy IN FRONT OF the slide (right, x:84%, y:58%) -->
  <g filter="url(#sh9)">
    <path d="M1260 360 L1320 360 L1450 580 L1390 580 Z" fill="#ef4444" stroke="#ffffff" stroke-width="5"/>
    <!-- Boy IN FRONT OF slide (x:86%, y:63% -> 1376, 567) -->
    <rect x="1352" y="585" width="20" height="72" rx="8" fill="#1d4ed8"/>
    <rect x="1384" y="585" width="20" height="72" rx="8" fill="#1d4ed8"/>
    <rect x="1342" y="485" width="72" height="108" rx="20" fill="#facc15"/>
    <circle cx="1378" cy="442" r="38" fill="#fed7aa"/>
    <path d="M1340 434 Q1346 394 1378 394 Q1410 394 1416 434 Z" fill="#451a03"/>
    <circle cx="1364" cy="442" r="4.5" fill="#1e293b"/>
    <circle cx="1392" cy="442" r="4.5" fill="#1e293b"/>
    <path d="M1366 458 Q1378 468 1390 458" fill="none" stroke="#9a3412" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
