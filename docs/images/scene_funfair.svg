    <circle cx="816" cy="438" r="32" fill="#f472b6"/>
    <line x1="816" y1="470" x2="816" y2="510" stroke="#ffffff" stroke-width="6"/>
    <!-- Popcorn Bucket (x:59%, y:49% -> 944, 441) -->
    <polygon points="915,455 965,455 955,510 925,510" fill="#ef4444"/>
    <circle cx="930" cy="448" r="12" fill="#fef08a"/>
    <circle cx="950" cy="448" r="12" fill="#fef08a"/>
    <circle cx="940" cy="436" r="12" fill="#ffffff"/>
