    <rect width="1600" height="900" fill="url(#sunGlow_scene_prep_desk.svg)" pointer-events="none"/>
    <rect width="1600" height="900" fill="url(#vignette_scene_prep_desk.svg)" pointer-events="none"/>
</svg>
