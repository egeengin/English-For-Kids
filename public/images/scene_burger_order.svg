    <circle cx="285" cy="170" r="34" fill="#f59e0b"/>
    <rect x="255" y="166" width="60" height="14" rx="6" fill="#78350f"/>
    <rect x="365" y="140" width="44" height="60" rx="8" fill="#ef4444"/>
    <rect x="445" y="140" width="60" height="50" rx="8" fill="#fde047"/>
  </g>

