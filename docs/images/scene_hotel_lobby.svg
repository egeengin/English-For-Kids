<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="lobbyWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="marbleFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="sh2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Wall & Marble Floor -->
  <rect width="1600" height="610" fill="url(#lobbyWall)"/>
  <rect y="610" width="1600" height="290" fill="url(#marbleFloor)"/>
  <ellipse cx="800" cy="760" rx="560" ry="70" fill="#38bdf8" opacity="0.22"/>

  <!-- Big Glass Entrance showing Palm Trees & Pool outside (x:18%, y:28%) -->
  <g filter="url(#sh2)">
    <rect x="90" y="90" width="380" height="390" rx="22" fill="#7dd3fc" stroke="#ffffff" stroke-width="10"/>
    <circle cx="170" cy="165" r="36" fill="#fde047"/>
    <!-- Palm Tree (x:15%, y:36%) -->
    <path d="M220 470 Q235 340 250 245" fill="none" stroke="#92400e" stroke-width="22" stroke-linecap="round"/>
    <ellipse cx="215" cy="238" rx="55" ry="16" transform="rotate(-25 215 238)" fill="#22c55e"/>
    <ellipse cx="290" cy="242" rx="55" ry="16" transform="rotate(20 290 242)" fill="#16a34a"/>
    <ellipse cx="255" cy="215" rx="45" ry="15" transform="rotate(-65 255 215)" fill="#4ade80"/>
  </g>

  <!-- Chandelier (x:52%, y:14% -> 832, 126) -->
  <g filter="url(#sh2)">
    <line x1="832" y1="0" x2="832" y2="85" stroke="#d97706" stroke-width="8"/>
    <ellipse cx="832" cy="115" rx="115" ry="26" fill="#fde047" stroke="#f59e0b" stroke-width="4"/>
    <circle cx="752" cy="105" r="14" fill="#fef08a"/>
    <circle cx="832" cy="100" r="16" fill="#fef08a"/>
    <circle cx="912" cy="105" r="14" fill="#fef08a"/>
  </g>

  <!-- Elevator (right, x:88%, y:42% -> 1408, 378) -->
  <g filter="url(#sh2)">
    <rect x="1290" y="210" width="230" height="400" rx="14" fill="#cbd5e1" stroke="#64748b" stroke-width="8"/>
    <rect x="1310" y="240" width="92" height="360" fill="#94a3b8"/>
    <rect x="1408" y="240" width="92" height="360" fill="#94a3b8"/>
    <rect x="1370" y="165" width="70" height="32" rx="8" fill="#1e293b"/>
    <circle cx="1405" cy="181" r="8" fill="#22c55e"/>
  </g>

  <!-- Reception Desk (center-left, x:42%, y:62%) -->
  <g filter="url(#sh2)">
    <rect x="520" y="470" width="420" height="180" rx="20" fill="#0ea5e9" stroke="#0369a1" stroke-width="5"/>
    <rect x="505" y="452" width="450" height="26" rx="10" fill="#ffffff"/>
    <!-- Hotel Receptionist (x:43%, y:40%) -->
    <rect x="645" y="365" width="92" height="90" rx="20" fill="#1e3a8a"/>
    <circle cx="691" cy="316" r="42" fill="#fed7aa"/>
    <path d="M648 310 Q654 264 691 264 Q728 264 734 310 Z" fill="#78350f"/>
    <circle cx="676" cy="316" r="5" fill="#1e293b"/>
    <circle cx="706" cy="316" r="5" fill="#1e293b"/>
    <path d="M676 336 Q691 348 706 336" fill="none" stroke="#9a3412" stroke-width="4" stroke-linecap="round"/>

    <!-- Key Card on Desk (x:36%, y:51% -> 576, 459) -->
    <rect x="550" y="432" width="54" height="34" rx="6" fill="#fde047" stroke="#eab308" stroke-width="3"/>
    <!-- Service Bell (x:50%, y:49% -> 800, 441) -->
    <path d="M778 452 Q800 416 822 452 Z" fill="#facc15" stroke="#ca8a04" stroke-width="3"/>
    <circle cx="800" cy="424" r="6" fill="#ca8a04"/>
  </g>

  <!-- Deniz (x:64%, y:58% -> 1024, 522) -->
  <g filter="url(#sh2)">
    <rect x="996" y="610" width="22" height="86" rx="9" fill="#0284c7"/>
    <rect x="1032" y="610" width="22" height="86" rx="9" fill="#0284c7"/>
    <ellipse cx="1005" cy="702" rx="20" ry="10" fill="#facc15"/>
    <ellipse cx="1045" cy="702" rx="20" ry="10" fill="#facc15"/>
    <rect x="984" y="482" width="82" height="134" rx="24" fill="#22c55e"/>
    <circle cx="1025" cy="432" r="44" fill="#fed7aa"/>
    <path d="M982 424 Q988 378 1025 378 Q1062 378 1068 424 Q1048 404 1025 406 Q1000 404 982 424 Z" fill="#451a03"/>
    <circle cx="1010" cy="432" r="5" fill="#1e293b"/>
    <circle cx="1040" cy="432" r="5" fill="#1e293b"/>
    <path d="M1012 450 Q1025 462 1038 450" fill="none" stroke="#9a3412" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Luggage Cart (x:75%, y:62% -> 1200, 558) -->
  <g filter="url(#sh2)">
    <rect x="1125" y="625" width="150" height="24" rx="10" fill="#f59e0b"/>
    <path d="M1140 625 L1140 435 Q1200 405 1260 435 L1260 625" fill="none" stroke="#d97706" stroke-width="10"/>
    <rect x="1152" y="545" width="88" height="80" rx="12" fill="#ef4444"/>
    <rect x="1170" y="485" width="66" height="60" rx="10" fill="#3b82f6"/>
    <circle cx="1148" cy="662" r="14" fill="#334155"/>
    <circle cx="1252" cy="662" r="14" fill="#334155"/>
  </g>

  <!-- Lobby Sofa (bottom-left, x:18%, y:74% -> 288, 666) -->
  <g filter="url(#sh2)">
    <rect x="130" y="600" width="310" height="120" rx="28" fill="#fb7185" stroke="#e11d48" stroke-width="5"/>
    <rect x="160" y="665" width="250" height="55" rx="16" fill="#fda4af"/>
  </g>
</svg>
