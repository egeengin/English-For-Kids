<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="nightWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="nightFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </radialGradient>
    <filter id="softDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Night Room Wall & Floor -->
  <rect width="1600" height="640" fill="url(#nightWall)"/>
  <rect y="640" width="1600" height="260" fill="url(#nightFloor)"/>
  <!-- Cozy Rug -->
  <ellipse cx="820" cy="770" rx="460" ry="70" fill="#a855f7" opacity="0.45"/>

  <!-- Lamp Warm Glow -->
  <circle cx="672" cy="400" r="240" fill="url(#lampGlow)"/>

  <!-- Night Window (Moon & Stars) -->
  <g filter="url(#softDrop)">
    <rect x="240" y="95" width="310" height="270" rx="22" fill="#0f172a" stroke="#c7d2fe" stroke-width="10"/>
    <!-- Crescent Moon (320, 180 -> x:20%, y:20%) -->
    <circle cx="325" cy="180" r="42" fill="#fde047"/>
    <circle cx="344" cy="168" r="36" fill="#0f172a"/>
    <!-- Stars (464, 234 -> x:29%, y:26%) -->
    <polygon points="464,196 472,216 494,218 477,232 482,254 464,242 446,254 451,232 434,218 456,216" fill="#fef08a"/>
    <circle cx="420" cy="150" r="6" fill="#fef08a"/>
    <circle cx="495" cy="160" r="5" fill="#fef08a"/>
    <circle cx="385" cy="290" r="6" fill="#fef08a"/>
    <circle cx="290" cy="285" r="5" fill="#fef08a"/>
    <!-- Window Frame -->
    <line x1="395" y1="95" x2="395" y2="365" stroke="#c7d2fe" stroke-width="8"/>
    <line x1="240" y1="230" x2="550" y2="230" stroke="#c7d2fe" stroke-width="8"/>
  </g>

  <!-- Bookshelf (left, 160, 468 -> x:10%, y:52%) -->
  <g filter="url(#softDrop)">
    <rect x="75" y="340" width="170" height="315" rx="14" fill="#92400e" stroke="#451a03" stroke-width="5"/>
    <rect x="92" y="365" width="136" height="80" rx="6" fill="#451a03"/>
    <rect x="92" y="465" width="136" height="80" rx="6" fill="#451a03"/>
    <!-- Books -->
    <rect x="102" y="378" width="22" height="67" rx="4" fill="#ef4444"/>
    <rect x="128" y="388" width="22" height="57" rx="4" fill="#38bdf8"/>
    <rect x="154" y="374" width="24" height="71" rx="4" fill="#facc15"/>
    <rect x="182" y="390" width="22" height="55" rx="4" fill="#22c55e"/>
    <rect x="105" y="480" width="26" height="65" rx="4" fill="#a855f7"/>
    <rect x="136" y="486" width="24" height="59" rx="4" fill="#fb923c"/>
  </g>

  <!-- Nightstand / Bedside Table -->
  <g filter="url(#softDrop)">
    <rect x="495" y="510" width="260" height="160" rx="18" fill="#b45309" stroke="#78350f" stroke-width="5"/>
    <rect x="515" y="535" width="220" height="52" rx="10" fill="#d97706"/>
    <circle cx="625" cy="561" r="8" fill="#fde047"/>

    <!-- Toothbrush & Cup (544, 495 -> x:34%, y:55%) -->
    <g transform="translate(515, 425)">
      <rect x="10" y="35" width="44" height="50" rx="10" fill="#38bdf8" stroke="#ffffff" stroke-width="3"/>
      <line x1="22" y1="40" x2="12" y2="2" stroke="#22c55e" stroke-width="8" stroke-linecap="round"/>
      <rect x="4" y="0" width="16" height="10" rx="3" fill="#ffffff"/>
      <line x1="40" y1="40" x2="48" y2="8" stroke="#f43f5e" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- Bedside Lamp (672, 396 -> x:42%, y:44%) -->
    <g transform="translate(620, 330)">
      <polygon points="20,90 84,90 70,28 34,28" fill="#fde047" stroke="#eab308" stroke-width="4"/>
      <rect x="47" y="90" width="10" height="65" fill="#94a3b8"/>
      <ellipse cx="52" cy="158" rx="28" ry="10" fill="#64748b"/>
    </g>

    <!-- Alarm Clock (704, 513 -> x:44%, y:57%) -->
    <g transform="translate(698, 462)">
      <circle cx="24" cy="28" r="22" fill="#f87171" stroke="#ffffff" stroke-width="4"/>
      <circle cx="24" cy="28" r="15" fill="#ffffff"/>
      <line x1="24" y1="28" x2="24" y2="18" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
      <line x1="24" y1="28" x2="32" y2="28" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Big Cozy Bed -->
  <g filter="url(#softDrop)">
    <rect x="850" y="360" width="590" height="330" rx="28" fill="#78350f" stroke="#451a03" stroke-width="6"/>
    <rect x="870" y="490" width="550" height="135" rx="22" fill="#ffffff"/>
    <!-- Pillow (1312, 477 -> x:82%, y:53%) -->
    <ellipse cx="1315" cy="480" rx="85" ry="38" fill="#e0f2fe" stroke="#93c5fd" stroke-width="4"/>

    <!-- Teddy Bear (960, 477 -> x:60%, y:53%) -->
    <g transform="translate(910, 415)">
      <circle cx="22" cy="20" r="14" fill="#d97706"/>
      <circle cx="78" cy="20" r="14" fill="#d97706"/>
      <circle cx="50" cy="40" r="32" fill="#f59e0b"/>
      <ellipse cx="50" cy="48" rx="14" ry="10" fill="#fde68a"/>
      <circle cx="50" cy="44" r="5" fill="#451a03"/>
      <circle cx="38" cy="34" r="4" fill="#1e293b"/>
      <circle cx="62" cy="34" r="4" fill="#1e293b"/>
      <ellipse cx="50" cy="86" rx="30" ry="28" fill="#f59e0b"/>
    </g>

    <!-- Boy / Deniz in Pajamas (1120, 432 -> x:70%, y:48%) -->
    <g>
      <rect x="1072" y="455" width="96" height="100" rx="24" fill="#38bdf8" stroke="#0284c7" stroke-width="3"/>
      <circle cx="1100" cy="495" r="7" fill="#fef08a"/>
      <circle cx="1140" cy="480" r="7" fill="#fef08a"/>
      <circle cx="1120" cy="410" r="44" fill="#fed7aa"/>
      <path d="M1076 402 Q1082 356 1120 356 Q1158 356 1164 402 Q1142 380 1120 382 Q1096 380 1076 402 Z" fill="#451a03"/>
      <circle cx="1104" cy="410" r="5" fill="#1e293b"/>
      <circle cx="1136" cy="410" r="5" fill="#1e293b"/>
      <path d="M1106 428 Q1120 440 1134 428" fill="none" stroke="#9a3412" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Blanket (1152, 648 -> x:72%, y:72%) -->
    <rect x="865" y="540" width="560" height="145" rx="28" fill="#6366f1" stroke="#4338ca" stroke-width="5"/>
    <circle cx="960" cy="610" r="14" fill="#a5b4fc" opacity="0.5"/>
    <circle cx="1080" cy="635" r="14" fill="#a5b4fc" opacity="0.5"/>
    <circle cx="1220" cy="605" r="14" fill="#a5b4fc" opacity="0.5"/>
    <circle cx="1340" cy="635" r="14" fill="#a5b4fc" opacity="0.5"/>

    <!-- Storybook (1120, 558 -> x:70%, y:62%) -->
    <g transform="translate(1062, 515)">
      <path d="M0 10 Q28 0 58 10 L58 65 Q28 55 0 65 Z" fill="#ffffff" stroke="#f59e0b" stroke-width="4"/>
      <path d="M58 10 Q88 0 116 10 L116 65 Q88 55 58 65 Z" fill="#fef3c7" stroke="#f59e0b" stroke-width="4"/>
      <circle cx="28" cy="35" r="10" fill="#38bdf8"/>
      <line x1="72" y1="26" x2="102" y2="26" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
      <line x1="72" y1="40" x2="98" y2="40" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Slippers on Rug (832, 756 -> x:52%, y:84%) -->
  <g filter="url(#softDrop)">
    <ellipse cx="800" cy="755" rx="34" ry="18" fill="#fb7185" stroke="#e11d48" stroke-width="3"/>
    <ellipse cx="872" cy="765" rx="34" ry="18" fill="#fb7185" stroke="#e11d48" stroke-width="3"/>
  </g>
</svg>
