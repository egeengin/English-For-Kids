    <rect x="1080" y="545" width="330" height="40" rx="14" fill="#f59e0b"/>
    <line x1="1145" y1="350" x2="1145" y2="545" stroke="#fde047" stroke-width="10"/>
    <line x1="1245" y1="350" x2="1245" y2="545" stroke="#fde047" stroke-width="10"/>
    <line x1="1345" y1="350" x2="1345" y2="545" stroke="#fde047" stroke-width="10"/>
    <polygon points="1060,355 1245,235 1430,355" fill="#ef4444" stroke="#ffffff" stroke-width="6"/>
  </g>

  <!-- Popcorn & Cotton Candy Stand (center, x:55%, y:58% -> 880, 522) -->
  <g filter="url(#sh12)">
    <rect x="780" y="510" width="190" height="145" rx="16" fill="#38bdf8" stroke="#0284c7" stroke-width="5"/>
