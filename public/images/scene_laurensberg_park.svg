<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="laurSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <filter id="shla" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  
    <radialGradient id="sunGlow_scene_laurensberg_park.svg" cx="50%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette_scene_laurensberg_park.svg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.16"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="480" fill="url(#laurSky)"/>

      <g data-enriched="true" opacity="0.85">
        <g fill="#ffffff" opacity="0.75">
          <ellipse cx="260" cy="125" rx="75" ry="28"/>
          <ellipse cx="305" cy="112" rx="52" ry="26"/>
          <ellipse cx="1220" cy="145" rx="85" ry="30"/>
          <ellipse cx="1270" cy="132" rx="58" ry="28"/>
        </g>
        <path d="M0 595 Q400 535 800 585 T1600 570 L1600 630 L0 630 Z" fill="#0f172a" opacity="0.06"/>
      </g>
  <rect y="480" width="1600" height="420" fill="#4ade80"/>
  <!-- Trees (left) -->
  <g filter="url(#shla)">
    <rect x="155" y="340" width="54" height="190" rx="12" fill="#78350f"/>
    <circle cx="182" cy="250" r="100" fill="#16a34a"/>
  </g>
  <!-- Duck Pond (x:24%, y:74% -> 384, 666) -->
  <g filter="url(#shla)">
    <ellipse cx="384" cy="680" rx="185" ry="68" fill="#38bdf8" stroke="#bae6fd" stroke-width="8"/>
    <!-- Duck -->
    <ellipse cx="384" cy="672" rx="28" ry="18" fill="#facc15"/>
    <circle cx="406" cy="650" r="15" fill="#facc15"/>
    <polygon points="418,648 434,652 418,656" fill="#f97316"/>
  </g>
  <!-- Swings (center, x:52%, y:46% -> 832, 414) -->
  <g filter="url(#shla)">
    <line x1="700" y1="290" x2="960" y2="290" stroke="#ef4444" stroke-width="14" stroke-linecap="round"/>
    <line x1="700" y1="290" x2="650" y2="540" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>
    <line x1="960" y1="290" x2="1010" y2="540" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>
    <line x1="780" y1="290" x2="780" y2="465" stroke="#475569" stroke-width="5"/>
    <line x1="880" y1="290" x2="880" y2="465" stroke="#475569" stroke-width="5"/>
    <rect x="760" y="465" width="140" height="16" rx="6" fill="#facc15"/>
  </g>
  <!-- Slide (right, x:82%, y:48% -> 1312, 432) -->
  <g filter="url(#shla)">
    <path d="M1220 320 L1280 320 L1430 560 L1370 560 Z" fill="#f97316" stroke="#ffffff" stroke-width="5"/>
  </g>
  <!-- Bicycle (x:66%, y:74% -> 1056, 666) -->
  <g filter="url(#shla)">
    <circle cx="1010" cy="695" r="34" fill="none" stroke="#1e293b" stroke-width="8"/>
    <circle cx="1115" cy="695" r="34" fill="none" stroke="#1e293b" stroke-width="8"/>
    <polyline points="1010,695 1055,645 1105,645 1115,695" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

    <rect width="1600" height="900" fill="url(#sunGlow_scene_laurensberg_park.svg)" pointer-events="none"/>
    <rect width="1600" height="900" fill="url(#vignette_scene_laurensberg_park.svg)" pointer-events="none"/>
</svg>
