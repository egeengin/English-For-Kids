<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bakBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <filter id="shb" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1600" height="620" fill="url(#bakBg)"/>
  <rect y="620" width="1600" height="280" fill="#fed7aa"/>
  <!-- Bakery Oven (left, x:18%, y:46% -> 288, 414) -->
  <g filter="url(#shb)">
    <rect x="110" y="250" width="320" height="360" rx="22" fill="#e2e8f0" stroke="#94a3b8" stroke-width="6"/>
    <rect x="150" y="330" width="240" height="160" rx="14" fill="#fb923c" stroke="#475569" stroke-width="6"/>
  </g>
  <!-- Baker Chef (x:42%, y:44% -> 672, 396) -->
  <g filter="url(#shb)">
    <rect x="624" y="395" width="96" height="150" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
    <circle cx="672" cy="340" r="46" fill="#fed7aa"/>
    <!-- Chef Hat -->
    <rect x="634" y="275" width="76" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="650" cy="264" r="22" fill="#ffffff"/>
    <circle cx="672" cy="256" r="24" fill="#ffffff"/>
    <circle cx="694" cy="264" r="22" fill="#ffffff"/>
    <circle cx="656" cy="340" r="5" fill="#1e293b"/>
    <circle cx="688" cy="340" r="5" fill="#1e293b"/>
    <path d="M658 360 Q672 372 686 360" fill="none" stroke="#9a3412" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- Bakery Counter with Treats (center-right) -->
  <g filter="url(#shb)">
    <rect x="520" y="540" width="880" height="180" rx="22" fill="#f472b6" stroke="#db2777" stroke-width="5"/>
    <rect x="505" y="522" width="910" height="28" rx="10" fill="#ffffff"/>
    <!-- Cupcakes (x:50%, y:52% -> 800, 468) -->
    <polygon points="775,490 825,490 818,522 782,522" fill="#f59e0b"/>
    <circle cx="800" cy="478" r="22" fill="#fda4af"/>
    <circle cx="800" cy="454" r="7" fill="#ef4444"/>
    <!-- Birthday Cake (x:66%, y:48% -> 1056, 432) -->
    <rect x="995" y="450" width="122" height="72" rx="12" fill="#fef08a" stroke="#f59e0b" stroke-width="4"/>
    <rect x="1020" y="405" width="72" height="45" rx="10" fill="#fbcfe8" stroke="#ec4899" stroke-width="4"/>
    <line x1="1056" y1="378" x2="1056" y2="405" stroke="#38bdf8" stroke-width="8"/>
    <circle cx="1056" cy="370" r="9" fill="#f97316"/>
    <!-- Croissant (x:80%, y:54% -> 1280, 486) -->
    <ellipse cx="1280" cy="500" rx="44" ry="20" fill="#f59e0b" stroke="#b45309" stroke-width="3"/>
  </g>
</svg>
