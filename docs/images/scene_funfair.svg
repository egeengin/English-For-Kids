<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="fairSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <filter id="sh12" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1600" height="580" fill="url(#fairSky)"/>
  <rect y="580" width="1600" height="320" fill="#86efac"/>
  <rect y="640" width="1600" height="260" fill="#fde68a"/>

  <!-- Giant Ferris Wheel (center-left, x:28%, y:36% -> 448, 324) -->
  <g filter="url(#sh12)">
    <line x1="448" y1="310" x2="340" y2="620" stroke="#475569" stroke-width="16" stroke-linecap="round"/>
    <line x1="448" y1="310" x2="556" y2="620" stroke="#475569" stroke-width="16" stroke-linecap="round"/>
    <circle cx="448" cy="310" r="195" fill="none" stroke="#f43f5e" stroke-width="12"/>
    <circle cx="448" cy="310" r="145" fill="none" stroke="#fde047" stroke-width="6"/>
    <!-- Cabins -->
    <rect x="424" y="92" width="48" height="40" rx="10" fill="#38bdf8"/>
    <rect x="615" y="290" width="48" height="40" rx="10" fill="#22c55e"/>
    <rect x="424" y="485" width="48" height="40" rx="10" fill="#a855f7"/>
    <rect x="232" y="290" width="48" height="40" rx="10" fill="#f97316"/>
