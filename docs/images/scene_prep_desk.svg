<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="roomBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="sh10" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  
    <radialGradient id="sunGlow_scene_prep_desk.svg" cx="50%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette_scene_prep_desk.svg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.16"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="630" fill="url(#roomBg)"/>

      <g data-enriched="true">
        <rect x="0" y="608" width="1600" height="14" fill="#0f172a" opacity="0.08"/>
        <line x1="0" y1="690" x2="1600" y2="690" stroke="#0f172a" stroke-opacity="0.06" stroke-width="3"/>
        <line x1="0" y1="775" x2="1600" y2="775" stroke="#0f172a" stroke-opacity="0.06" stroke-width="3"/>
        <line x1="0" y1="855" x2="1600" y2="855" stroke="#0f172a" stroke-opacity="0.06" stroke-width="3"/>
      </g>
  <rect y="630" width="1600" height="270" fill="#fed7aa"/>

  <!-- Bed (left, x:20%, y:56%) -->
  <g filter="url(#sh10)">
    <rect x="85" y="430" width="350" height="210" rx="24" fill="#6366f1"/>
    <rect x="105" y="510" width="310" height="95" rx="18" fill="#ffffff"/>
    <ellipse cx="170" cy="490" rx="50" ry="22" fill="#bae6fd"/>
    <!-- Slippers UNDER the bed (x:22%, y:74% -> 352, 666) -->
    <ellipse cx="330" cy="664" rx="26" ry="13" fill="#fb7185"/>
    <ellipse cx="386" cy="668" rx="26" ry="13" fill="#fb7185"/>
  </g>

  <!-- Nightstand & Lamp NEXT TO the bed (x:34%, y:50% -> 544, 450) -->
  <g filter="url(#sh10)">
    <rect x="475" y="495" width="135" height="145" rx="14" fill="#b45309"/>
    <polygon points="512,430 572,430 558,370 526,370" fill="#fde047" stroke="#eab308" stroke-width="4"/>
    <rect x="537" y="430" width="10" height="65" fill="#64748b"/>
  </g>

  <!-- Poster ABOVE the desk (x:62%, y:22% -> 992, 198) -->
  <g filter="url(#sh10)">
    <rect x="910" y="110" width="170" height="190" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="6"/>
    <circle cx="995" cy="195" r="40" fill="#38bdf8"/>
    <ellipse cx="995" cy="195" rx="66" ry="14" transform="rotate(-20 995 195)" fill="none" stroke="#fde047" stroke-width="6"/>
  </g>

  <!-- Desk (x:62%, y:54%) -->
  <g filter="url(#sh10)">
    <rect x="850" y="470" width="310" height="26" rx="10" fill="#d97706"/>
    <rect x="875" y="496" width="22" height="145" fill="#92400e"/>
    <rect x="1115" y="496" width="22" height="145" fill="#92400e"/>
    <!-- Robot ON the desk (x:62%, y:44% -> 992, 396) -->
    <rect x="962" y="370" width="60" height="72" rx="12" fill="#38bdf8" stroke="#0284c7" stroke-width="3"/>
    <rect x="974" y="340" width="36" height="30" rx="8" fill="#7dd3fc"/>
    <circle cx="984" cy="354" r="4" fill="#1e293b"/>
    <circle cx="1000" cy="354" r="4" fill="#1e293b"/>
  </g>

  <!-- Backpack BETWEEN the desk and the chair (x:77%, y:62% -> 1232, 558) -->
